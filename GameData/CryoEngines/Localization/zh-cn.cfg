    #LOC_CryoEngines_cryoengine-hecate-1_description = 一款久负盛名的厨房电器——呃，火箭发动机，能够高效燃烧液氢和氧化剂，适用于轨道飞行器。可收纳的喷管延长装置使体积更为紧凑。
